name: Bug report
description: Something isn't working the way it should.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first.

        This project supports **macOS and Linux only**. Auth is `CURSOR_API_KEY`.
        When the CLI lands, run `cursorloop doctor` before filing if you can.

  - type: input
    id: version
    attributes:
      label: cursorloop version
      description: Package version or git commit SHA
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Other Unix-like (specify below)
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`
      placeholder: "Python 3.12.x"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Expected vs actual behavior
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps; redact secrets (`crsr_…` keys).
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redacted excerpts from console or `.cursorloop/runs/.../audit.jsonl`
      render: shell
    validations:
      required: false
