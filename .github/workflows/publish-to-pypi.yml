name: Publish to PyPI

# This filename is load-bearing: PyPI's Trusted Publisher configuration for
# the `cursorloop` project matches on the workflow FILENAME
# `publish-to-pypi.yml` exactly. Renaming this file requires updating that
# configuration at pypi.org first, or every subsequent release will fail
# with an OIDC identity mismatch. See docs/contributing/release.md.
# (reindexed for workflow_dispatch discovery)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read  # workflow-level default-deny baseline

jobs:
  build:
    name: Build distributions
    # Deliberately NO id-token permission here — this job runs our code and
    # our dependencies, and must never hold a credential capable of
    # publishing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # TestPyPI dry-runs always build `develop`, regardless of which
          # branch the workflow_dispatch UI selected. Real PyPI builds the
          # release tag (on main) via github.sha. Do not publish main tip
          # to TestPyPI.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'develop' || github.sha }}

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Verify package metadata
        run: twine check --strict dist/*

      - name: Confirm py.typed ships in the wheel
        run: unzip -l dist/*.whl | grep -q py.typed

      - name: Install the built wheel into a clean venv and run the console script
        run: |
          python -m venv /tmp/cursorloop-smoke
          /tmp/cursorloop-smoke/bin/pip install --upgrade pip
          /tmp/cursorloop-smoke/bin/pip install dist/*.whl
          /tmp/cursorloop-smoke/bin/cursorloop --version
          /tmp/cursorloop-smoke/bin/cursorloop --help

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    if: github.event_name == 'release' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      # Requires a manual approval gate configured on this GitHub
      # environment — see docs/contributing/release.md. This is what makes
      # Trusted Publishing meaningfully stronger than a repo-scoped API
      # token: anyone with commit access could otherwise modify this
      # workflow, but they still can't approve their own publish without a
      # second reviewer.
      name: pypi
      url: https://pypi.org/p/cursorloop
    permissions:
      id-token: write  # job-scoped, mandatory for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      # Pinned to a commit SHA (not the `release/v1` branch pointer) per
      # this action's own README guidance. dc37677b... corresponds to the
      # v1.14.2 tag at the time this workflow was written; Dependabot's
      # github-actions ecosystem (.github/dependabot.yml) keeps this current.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # No `user`/`password` — OIDC handles auth via the id-token above.

  publish-testpypi:
    name: Publish to TestPyPI (dry run)
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/cursorloop
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI accumulates junk from repeated dry runs; unlike the real
          # `publish` job above, silently tolerating a re-upload of the same
          # version here is correct, not a masked failure.
          skip-existing: true
